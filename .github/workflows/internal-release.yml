name: Internal Release

on:
  push:
    tags:
      - "v*-internal.*"

permissions:
  contents: write

jobs:
  build-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build packaging image
        run: |
          docker build -t telegraf-ci -f scripts/ci.docker .

      - name: Build packages
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/go/src/github.com/influxdata/telegraf" \
            -w /go/src/github.com/influxdata/telegraf \
            telegraf-ci \
            make package include_packages="linux_amd64.tar.gz amd64.deb x86_64.rpm"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*
