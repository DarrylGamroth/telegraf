name: Internal Release

on:
  push:
    tags:
      - "v*-internal.*"

permissions:
  contents: write
  packages: write

jobs:
  build-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build packaging image
        run: |
          docker build -t telegraf-ci -f scripts/ci.docker .

      - name: Prepare Go caches
        run: |
          mkdir -p .cache/go-build .cache/go-mod

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            .cache/go-build
            .cache/go-mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build packages
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/.cache/go-build:/root/.cache/go-build" \
            -v "$GITHUB_WORKSPACE/.cache/go-mod:/go/pkg/mod" \
            -v "$GITHUB_WORKSPACE:/go/src/github.com/influxdata/telegraf" \
            -w /go/src/github.com/influxdata/telegraf \
            telegraf-ci \
            bash -c "git config --global --add safe.directory /go/src/github.com/influxdata/telegraf && make deps GOFLAGS=\"-buildvcs=false -mod=mod\" && make package include_packages=\"linux_amd64.tar.gz amd64.deb x86_64.rpm linux_arm64.tar.gz arm64.deb aarch64.rpm\" GOFLAGS=\"-buildvcs=false -mod=mod\""

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*

  build-container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./scripts/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/darrylgamroth/telegraf:${{ github.ref_name }}
            ghcr.io/darrylgamroth/telegraf:latest-internal
